name: App

on:
  push:
    branches: [main, hitlist-v1]
    paths: ["DAAT/**", "!DAAT/functions/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["DAAT/**", "!DAAT/functions/**"]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DAAT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared code tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace
      - name: Build debug and release APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hitlist-debug-apk
          path: DAAT/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iPhone build
    runs-on: macos-15
    defaults:
      run:
        working-directory: DAAT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared code for iPhone
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build the iPhone app for the simulator
        run: |
          cd iosApp
          xcodebuild build \
            -project Hitlist.xcodeproj -scheme Hitlist -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation | tail -n 200
          exit ${PIPESTATUS[0]}
